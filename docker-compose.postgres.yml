services:
  postgres:
    image: postgres:16
    container_name: inspectra-postgres
    environment:
      POSTGRES_USER: inspectra
      POSTGRES_PASSWORD: inspectra
      POSTGRES_DB: inspectra
    ports:
      - "5432:5432"
    volumes:
      - inspectra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspectra -d inspectra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inspectra-postgres-data:
